<vex-page-layout @fadeInRight>

  <vex-page-layout-content [class.container]="layoutCtrl.value === 'boxed'"
    [class.px-6]="layoutCtrl.value === 'fullwidth'" class="-mt-6">
    <div class="card mt-4">
      <div class="dashboard-lite p-4">
        <div class="bg-app-bar appbar px-6 h-16 border-b sticky top-0 left-0 flex items-center z-10">
          <nav class="breadcrumb-simple" aria-label="Ruta de navegación">
            <a routerLink="/administracion" class="crumb-link">
              <mat-icon inline>home</mat-icon>
              Administración
            </a>
            <span class="sep">/</span>
            <span class="crumb-current" aria-current="page">Pasajeros</span>
            <span class="sep">/</span>
            <span class="crumb-current" aria-current="page">{{ title }}</span>
          </nav>
        </div>

        <section class="mt-5 table-shell">
          <form [formGroup]="pasajeroForm">
            <div class="fm-grid">
              <div class="fm-divider fm-span-3">Datos Generales</div>

              <div class="fm-group">
                <label id="lbl-nombre">
                  <i class="fa fa-user doc-icon" aria-hidden="true"></i>
                  Nombre
                </label>
                <mat-form-field appearance="fill">
                  <input matInput placeholder="Nombre" formControlName="nombre"
                    [attr.aria-labelledby]="'lbl-nombre'"
                    (keydown)="bloquearCaracteresEspecialesNombre($event)"
                    (paste)="onPasteNombre($event)">
                </mat-form-field>
              </div>

              <div class="fm-group">
                <label id="lbl-apellido-paterno">
                  <i class="fa fa-user-pen doc-icon" aria-hidden="true"></i>
                  Apellido Paterno
                </label>
                <mat-form-field appearance="fill">
                  <input matInput placeholder="Apellido Paterno" formControlName="apellidoPaterno"
                    [attr.aria-labelledby]="'lbl-apellido-paterno'">
                </mat-form-field>
              </div>

              <div class="fm-group">
                <label id="lbl-apellido-materno">
                  <i class="fa fa-user doc-icon" aria-hidden="true"></i>
                  Apellido Materno
                </label>
                <mat-form-field appearance="fill">
                  <input matInput placeholder="Apellido Materno" formControlName="apellidoMaterno"
                    [attr.aria-labelledby]="'lbl-apellido-materno'">
                </mat-form-field>
              </div>

              <div class="fm-group">
                <label id="lbl-telefono">
                  <i class="fa fa-phone doc-icon" aria-hidden="true"></i>
                  Teléfono
                </label>
                <mat-form-field appearance="fill">
                  <input matInput type="tel" placeholder="Teléfono" formControlName="telefono"
                    [attr.aria-labelledby]="'lbl-telefono'" maxlength="10" (keypress)="allowOnlyNumbers($event)">
                </mat-form-field>
              </div>

              <div class="fm-group">
                <label id="lbl-correo">
                  <i class="fa fa-envelope doc-icon" aria-hidden="true"></i>
                  Correo Electrónico
                </label>
                <mat-form-field appearance="fill">
                  <input matInput type="email" placeholder="Correo Electrónico" formControlName="correo"
                    [attr.aria-labelledby]="'lbl-correo'">
                </mat-form-field>
              </div>

              <div class="fm-group">
                <label id="lbl-fecha-nacimiento">
                  <i class="fa fa-calendar-day doc-icon" aria-hidden="true"></i>
                  Fecha de Nacimiento
                </label>
                <mat-form-field appearance="fill">
                  <input matInput type="date" placeholder="Fecha de Nacimiento" formControlName="fechaNacimiento"
                    [attr.aria-labelledby]="'lbl-fecha-nacimiento'">
                </mat-form-field>
              </div>

              <div class="fm-group">
                <label id="lbl-curp">
                  <i class="fa fa-id-card doc-icon" aria-hidden="true"></i>
                  CURP
                </label>
                <mat-form-field appearance="fill">
                  <input matInput placeholder="CURP" formControlName="curp" maxlength="18"
                    [attr.aria-labelledby]="'lbl-curp'">
                </mat-form-field>
              </div>

              <div class="fm-group">
                <label id="lbl-numero-serie">
                  <i class="fa fa-barcode doc-icon" aria-hidden="true"></i>
                  Número de Serie
                </label>
                <mat-form-field appearance="fill">
                  <input matInput placeholder="Número de Serie" formControlName="numeroSerieMonedero"
                    [attr.aria-labelledby]="'lbl-numero-serie'">
                </mat-form-field>
              </div>

              <div class="fm-group">
                <label id="lbl-tipo-pasajero">
                  <i class="fa fa-users doc-icon" aria-hidden="true"></i>
                  Tipo Pasajero
                </label>
                <mat-form-field appearance="fill">
                  <mat-select formControlName="idTipoPasajero" placeholder="Seleccione un tipo"
                    [attr.aria-labelledby]="'lbl-tipo-pasajero'">
                    <mat-option [value]="null">— Seleccione —</mat-option>
                    <mat-option *ngFor="let tipo of listaTiposPasajero" [value]="tipo.id">
                      {{ tipo.nombre }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <div class="fm-group" *ngIf="!idPasajero">
                <label id="lbl-password">
                  <i class="fa fa-lock doc-icon" aria-hidden="true"></i>
                  Contraseña
                </label>
                <mat-form-field appearance="fill">
                  <input matInput type="password" placeholder="Contraseña" formControlName="passwordHash"
                    [attr.aria-labelledby]="'lbl-password'">
                </mat-form-field>
              </div>

              <div class="fm-group">
                <label id="lbl-documentacion">
                  <i class="fa fa-file doc-icon" aria-hidden="true"></i>
                  Documentación Oficial
                </label>
                <div 
                  class="file-upload-area file-upload-small"
                  [class.dragging]="documentoDragging"
                  (dragover)="onDocumentoDragOver($event)"
                  (dragleave)="onDocumentoDragLeave($event)"
                  (drop)="onDocumentoDrop($event)"
                  (click)="openDocumentoFilePicker()">
                  <input 
                    id="documentacion-file"
                    type="file" 
                    accept=".pdf,image/*"
                    (change)="onDocumentoFileSelected($event)"
                    style="display: none;">
                  
                  <div *ngIf="!documentoPreviewUrl && !selectedFileName" class="file-upload-content">
                    <mat-icon class="upload-icon-small">description</mat-icon>
                    <p class="upload-text-small">Arrastra o haz clic</p>
                  </div>
                  
                  <div *ngIf="documentoPreviewUrl || selectedFileName" class="file-preview-small">
                    <img *ngIf="documentoPreviewUrl" [src]="documentoPreviewUrl" alt="Preview" class="preview-image-small">
                    <div *ngIf="!documentoPreviewUrl" class="file-icon-preview-small">
                      <mat-icon class="file-icon-small">description</mat-icon>
                    </div>
                    <div class="file-info-small">
                      <p class="file-name-small">{{ selectedFileName }}</p>
                      <button type="button" class="btn-remove-small" (click)="removeDocumentoFile($event)">
                        <mat-icon>close</mat-icon>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="fm-span-3 fm-actions">
                <div class="fm-actions-right">
                  <button mat-raised-button color="primary" type="button" (click)="submit()">
                    <mat-icon>save</mat-icon>
                    Guardar
                  </button>
                  <button mat-raised-button (click)="regresar()" color="warn" type="button">
                    <mat-icon>close</mat-icon>
                    Cancelar
                  </button>
                </div>
              </div>
            </div>

          </form>
        </section>
      </div>
    </div>
  </vex-page-layout-content>
</vex-page-layout>
