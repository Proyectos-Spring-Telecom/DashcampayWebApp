<vex-page-layout @fadeInRight>
  <vex-page-layout-content [class.container]="layoutCtrl.value === 'boxed'"
    [class.px-6]="layoutCtrl.value === 'fullwidth'" class="-mt-6">
    <div class="card mt-4">
      <div class="dashboard-lite p-4">
        <div class="bg-app-bar appbar px-6 h-16 border-b sticky top-0 left-0 flex items-center z-10">
          <nav class="breadcrumb-simple" aria-label="Ruta de navegación">
            <a routerLink="/administracion" class="crumb-link">
              <mat-icon inline>home</mat-icon>
              Administración
            </a>
            <span class="sep">/</span>
            <span class="crumb-current" aria-current="page">Permisos</span>
          </nav>
          <div class="flex-grow"></div>
          <div class="flex gap-3 actions-bar">
            <button mat-raised-button color="primary" type="button" class="btn-soft textGenerico"
              (click)="toggleExpandGroups()" matTooltip="Expandir / Contraer grupos">
              <mat-icon svgIcon="mat:compare_arrows"></mat-icon>
              <span class="btn-text">{{ autoExpandAllGroups ? 'Contraer' : 'Expandir' }}</span>
            </button>
            <button mat-raised-button color="accent" type="button" class="btn-soft textGenerico"
              (click)="limpiarCampos()" matTooltip="Limpiar filtros">
              <mat-icon svgIcon="mat:restore"></mat-icon>
              <span class="btn-text">Limpiar</span>
            </button>
            <button [appHasPermission]="['14']" (click)="agregarPermiso()" mat-raised-button color="warn" type="button"
              class="btn-soft textGenerico" matTooltip="Agregar usuario">
              <mat-icon>add</mat-icon>
              <span class="btn-text">Agregar</span>
            </button>
          </div>
        </div>
        <section class="mt-5 table-shell">
          <dx-data-grid #gridContainer id="gridContainer" [columnHidingEnabled]="true" [showBorders]="true"
            [showColumnLines]="true" [showRowLines]="true" [rowAlternationEnabled]="true" [dataSource]="listaPermisos"
            [keyExpr]="'id'" [width]="'100%'" [remoteOperations]="{ paging: true, sorting: true }" [paging]="{ pageSize: pageSize }"
            [pager]="{ 
                showPageSizeSelector: true, 
                allowedPageSizes: [50], 
                showInfo: true,
                infoText: 'Página {0} de {1}', 
                visible: true 
            }" (onPageIndexChanged)=" onPageIndexChanged($event)"
            (onOptionChanged)="onGridOptionChanged($event)">
            <dxo-search-panel [visible]="true" [width]="200" placeholder="Buscar..."></dxo-search-panel>
            <dxo-toolbar>
              <dxi-item name="groupPanel" location="before"></dxi-item>
              <dxi-item name="exportButton" location="after" [options]="{ text: 'Exportar Grid', icon: 'export' }"
                [showText]="'always'">
              </dxi-item>
              <dxi-item name="searchPanel" location="after"></dxi-item>
            </dxo-toolbar>
            <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[20, 50, 100]" [showInfo]="true"></dxo-pager>
            <dxo-group-panel [emptyPanelText]="mensajeAgrupar" [visible]="true"></dxo-group-panel>
            <dxo-filter-row [visible]="showFilterRow"></dxo-filter-row>
            <dxo-header-filter [visible]="showHeaderFilter"></dxo-header-filter>
            <dxi-column *appHasPermission="['15','16']" caption="Acciones" cellTemplate="Acciones" alignment="center" [width]="180"></dxi-column>
            <dxo-grouping #expand [autoExpandAll]="true"></dxo-grouping>
            <dxi-column dataField="id" caption="Id" alignment="center" dataType="number" [allowSorting]="true" [allowSearch]="true"></dxi-column>
            <dxi-column dataField="nombre" caption="Nombre" alignment="center" dataType="string" [allowSearch]="true"></dxi-column>
            <dxi-column dataField="descripcion" caption="Descripción" alignment="center" dataType="string" [allowSearch]="true"></dxi-column>
            <dxi-column dataField="idModulo2.nombre" caption="Módulo" alignment="center" dataType="string" [allowSearch]="true">
              <dxo-header-filter [allowSearch]="true"></dxo-header-filter>
            </dxi-column>
            <dxi-column dataField="estatus" caption="Estatus" alignment="center" cellTemplate="est">
              <div *dxTemplate="let f of 'est'">
                <span [ngClass]="f.data.estatus === 1 ? 'badge-status activo' : 'badge-status inactivo'">
                  {{ f.data.estatus === 1 ? 'Activo' : 'Inactivo' }}
                </span>
              </div>
            </dxi-column>
            <div *dxTemplate="let row of 'Acciones'" class="d-flex gap-3 justify-content-center">
              <div [appHasPermission]="['15']">
                <button class="btn-edit" (click)="actualizarPermiso(row.data.id)">
                  <mat-icon class="btn__icon">edit</mat-icon>
                </button>
              </div>
              <div [appHasPermission]="['16']">
                <button *ngIf="row.data.estatus === 0" class="btn-active" (click)="activar(row.data)">
                  <mat-icon class="btn__icon">check_circle</mat-icon>
                </button>
                <button *ngIf="row.data.estatus === 1" class="btn-desactive" (click)="desactivar(row.data)">
                  <mat-icon class="btn__icon">block</mat-icon>
                </button>
              </div>
            </div>
            <dxo-export [enabled]="false" [allowExportSelectedData]="false"
              [texts]="{ exportAll: 'Exportar todos los datos a Excel' }">
            </dxo-export>
          </dx-data-grid>
        </section>
      </div>
    </div>
  </vex-page-layout-content>
</vex-page-layout>
